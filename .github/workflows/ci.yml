name: Test OpenGL Headless (Java 24 + Maven)

on:
  push:
    paths: [ '**.java', '**/pom.xml', '.github/workflows/**' ]
  pull_request:
    paths: [ '**.java', '**/pom.xml', '.github/workflows/**' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 24
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 24
          cache: maven

      - name: Set DISPLAY variable
        run: echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Start X virtual framebuffer
        run: |
          sudo apt update
          sudo apt install -y xvfb libgl1-mesa-dev libglu1-mesa-dev libglfw3-dev
          Xvfb :99 -screen 0 1024x768x24 &


      - name: Build with Maven
        run: mvn -B verify
